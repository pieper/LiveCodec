[project]
name = "livecodec"
version = "0.1.0"
description = "Asymmetric neural preview codec for IDC/LNQ volumetric medical images (heavy encoder, browser-light decoder)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Steve Pieper", email = "pieper@isomics.com" }]
dependencies = [
    "numpy",
    "pandas",
    "pydicom>=2.4",
    "idc-index",
    "scikit-image",
    "zstandard",
    "matplotlib",
    "tqdm",
    "pylibjpeg-openjpeg>=2.5.0",
]

[project.optional-dependencies]
train = ["torch", "monai"]
dev = ["pytest", "ruff"]

[project.scripts]
livecodec-cohort = "livecodec.cohorts:main"
livecodec-baseline = "livecodec.baseline:main"
livecodec-train2d = "livecodec.train2d:main"
livecodec-train3d = "livecodec.train3d:main"
livecodec-pack = "livecodec.pack:main"
livecodec-export = "livecodec.export_onnx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livecodec"]

[tool.ruff]
line-length = 100
