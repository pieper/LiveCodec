<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LiveCodec — HTJ2K browser decode benchmark</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 46rem; padding: 0 1rem; }
    table { border-collapse: collapse; margin-top: 1rem; }
    td, th { border: 1px solid #ccc; padding: 0.3rem 0.7rem; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    #status { color: #666; }
    canvas { border: 1px solid #ccc; margin-top: 1rem; image-rendering: pixelated; width: 256px; }
  </style>
</head>
<body>
  <h1>HTJ2K browser decode benchmark</h1>
  <p>Phase 0 baseline for LiveCodec: wasm (OpenJPH) decode speed of HTJ2K
     codestreams generated by <code>make_streams.py</code>. Serve this directory
     with <code>python3 -m http.server</code> and open it.</p>
  <p id="status">loading wasm…</p>
  <table id="results" hidden>
    <thead><tr><th>variant</th><th>MB (16 slices)</th><th>ms/slice</th><th>MP/s</th><th>est. full volume</th></tr></thead>
    <tbody></tbody>
  </table>
  <canvas id="preview" width="512" height="512"></canvas>
  <!-- UMD build: classic script sets window.Module to the wasm factory -->
  <script src="./node_modules/@cornerstonejs/codec-openjph/dist/openjphjs.js"></script>
  <script type="module">
    const REPS = 5;
    const status = (m) => (document.getElementById("status").textContent = m);

    const openjph = await window.Module();
    const decoder = new openjph.HTJ2KDecoder();
    const manifest = await (await fetch("./streams/manifest.json")).json();

    function decodeOnce(bytes) {
      const buf = decoder.getEncodedBuffer(bytes.length);
      buf.set(bytes);
      decoder.decode();
      return decoder.getDecodedBuffer();
    }

    const tbody = document.querySelector("#results tbody");
    document.getElementById("results").hidden = false;
    let shownPreview = false;

    for (const variant of Object.keys(manifest.slices[0].files)) {
      status(`benchmarking ${variant}…`);
      const datas = [];
      for (const s of manifest.slices) {
        const r = await fetch(`./streams/${s.files[variant].path}`);
        datas.push(new Uint8Array(await r.arrayBuffer()));
      }
      decodeOnce(datas[0]); // warm-up
      const t0 = performance.now();
      let pixels = 0;
      for (let r = 0; r < REPS; r++)
        for (const d of datas) pixels += decodeOnce(d).length / 2;
      const ms = performance.now() - t0;
      const msPerSlice = ms / (REPS * datas.length);
      const mb = datas.reduce((a, d) => a + d.length, 0) / 1e6;
      const row = tbody.insertRow();
      const est = ((msPerSlice * manifest.shape[0]) / 1000).toFixed(2) + " s";
      for (const v of [variant, mb.toFixed(2), msPerSlice.toFixed(1),
                       (pixels / 1e6 / (ms / 1000)).toFixed(0), est])
        row.insertCell().textContent = v;

      if (!shownPreview && variant.startsWith("qstep")) {
        shownPreview = true;
        const mid = datas[Math.floor(datas.length / 2)];
        const view = decodeOnce(mid);
        const decoded = new Uint16Array(
          view.buffer.slice(view.byteOffset, view.byteOffset + view.byteLength)
        );
        const info = decoder.getFrameInfo();
        const canvas = document.getElementById("preview");
        canvas.width = info.width; canvas.height = info.height;
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(info.width, info.height);
        for (let i = 0; i < decoded.length; i++) {
          // soft-tissue window on HU+1024 data: L 1064, W 400
          const g = Math.max(0, Math.min(255, ((decoded[i] - 864) / 400) * 255));
          img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = g;
          img.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
    }
    status(`done — ${REPS} reps × ${manifest.slices.length} slices per variant`);
  </script>
</body>
</html>
